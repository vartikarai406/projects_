version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqnet-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./resqnet.db
      - JWT_SECRET=resqnet-secret-key-eval-2026-disaster-response
      - IS_SIMULATED_DATA=True
    volumes:
      - ./backend/uploads:/app/uploads
      - resqnet-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resqnet-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  resqnet-data:
